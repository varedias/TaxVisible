<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>税款可视化 - 看见你的贡献</title>
    <link rel="stylesheet" href="styles.css">
    <!-- 引入二维码扫描库 -->
    <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
</head>
<body>
    <!-- 引导欢迎页面 -->
    <div id="welcome-page" class="welcome-page">
        <div class="welcome-content">
            <!-- 顶部标题 -->
            <h1 class="welcome-title">税款可视化</h1>
            
            <!-- 中央图标 -->
            <div class="welcome-icon">
                <div class="circle-badge">
                    <svg class="star-icon" viewBox="0 0 51 48" fill="none">
                        <path d="M25.5 0L31.3124 18.1459H50.2901L35.0889 29.2082L40.9012 47.3541L25.5 36.2918L10.0988 47.3541L15.9111 29.2082L0.70993 18.1459H19.6876L25.5 0Z" fill="currentColor"/>
                    </svg>
                </div>
            </div>
            
            <!-- 副标题 -->
            <p class="welcome-subtitle">看见你的贡献，感受税收的力量</p>
            
            <!-- 扫码按钮 -->
            <button class="scan-button" onclick="enterMainApp()">
                <svg class="button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <rect x="3" y="3" width="7" height="7" stroke-width="2"/>
                    <rect x="14" y="3" width="7" height="7" stroke-width="2"/>
                    <rect x="3" y="14" width="7" height="7" stroke-width="2"/>
                    <rect x="14" y="14" width="7" height="7" stroke-width="2"/>
                </svg>
                扫税码
            </button>
            
            <!-- 底部说明 -->
            <p class="welcome-hint">扫描商品条码，查看税款贡献</p>
        </div>
    </div>

    <div class="container" id="main-container" style="display: none;">
        <main>
            <!-- 第一步：价格输入界面 -->
            <div id="step1-content" class="step-content active">
                <!-- 二维码扫描区域 -->
                <section class="camera-section">
                    <h2>二维码扫描</h2>
                    <div class="qr-scanner-container">
                        <video id="video" autoplay playsinline></video>
                        <canvas id="canvas" style="display: none;"></canvas>
                        <div class="qr-overlay">
                            <div class="qr-frame"></div>
                            <p class="qr-hint">将二维码对准框内</p>
                        </div>
                    </div>
                    <div class="qr-status">
                        <span id="qrStatus">等待启动扫描...</span>
                    </div>
                </section>

                <div class="divider">
                    <span>或</span>
                </div>

                <!-- 手动输入区域 -->
                <section class="input-section">
                    <h2>手动输入</h2>
                    <div class="input-container">
                        <div class="input-item">
                            <label>商品价格 (¥):</label>
                            <input type="number" id="price" step="0.01" placeholder="请输入商品价格" min="0">
                        </div>
                        <div class="input-item">
                            <label>税率 (%):</label>
                            <input type="number" id="taxRate" step="0.01" placeholder="请输入税率" min="0" max="100">
                        </div>
                        <div class="input-item result-highlight">
                            <div class="tax-price-display">
                                <span id="taxPrice">¥0.00</span>
                            </div>
                        </div>
                    </div>
                    <div class="action-buttons">
                        <button id="nextStep" class="btn btn-primary">▶️ 进入动画展示</button>
                    </div>
                </section>

                <!-- 快速预设 -->
                <section class="preset-section">
                    <h3>快速预设税率</h3>
                    <div class="preset-buttons">
                        <button class="btn-preset" data-rate="6">6% 增值税</button>
                        <button class="btn-preset" data-rate="13">13% 增值税</button>
                        <button class="btn-preset" data-rate="10">10% 服务税</button>
                        <button class="btn-preset" data-rate="5">5% 消费税</button>
                    </div>
                </section>
            </div>

            <!-- 第二步：Unity动画展示界面 -->
            <div id="step2-content" class="step-content">
                <!-- Unity动画区域 -->
                <section class="unity-section">
                    <h2>🎬 动画展示</h2>
                    <div class="unity-container">
                        <div id="unity-canvas-container">
                            <canvas id="unity-canvas"></canvas>
                        </div>
                        <div class="unity-loading" id="unity-loading">
                            <div class="spinner"></div>
                            <p id="unity-loading-text">准备加载... 0% (0/15.5 MB)</p>
                            <div class="loading-progress">
                                <div class="loading-progress-bar" id="unity-progress-bar"></div>
                            </div>
                        </div>
                    </div>
                    <div class="unity-controls">
                        <button id="backToInput" class="btn btn-secondary">⬅️ 返回输入</button>
                    </div>
                </section>
            </div>
        </main>

        <footer>
            <p>&copy; 2025 智能商品税价计算系统</p>
        </footer>
    </div>

    <!-- Unity Loader -->
    <script src="./Unity/Build/Unity.loader.js"></script>
    
    <!-- 主要脚本 -->
    <script src="./script.js"></script>
</body>
</html>
