<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect fill="url(#bg10)" width="400" height="400"/>
  <!-- 3D Scanner Frame -->
  <rect x="100" y="100" width="200" height="220" rx="8" fill="#1e293b"/>
  <!-- Scanning area -->
  <rect x="120" y="120" width="160" height="140" rx="4" fill="#0f172a"/>
  <!-- 3D Object being scanned -->
  <polygon points="200,140 240,200 200,260 160,200" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="200,140 240,200 200,180" fill="#3b82f6" opacity="0.3"/>
  <polygon points="200,140 160,200 200,180" fill="#60a5fa" opacity="0.3"/>
  <polygon points="200,260 240,200 200,180" fill="#1e40af" opacity="0.3"/>
  <polygon points="200,260 160,200 200,180" fill="#2563eb" opacity="0.3"/>
  <!-- Scan lines -->
  <line x1="130" y1="160" x2="270" y2="160" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <line x1="130" y1="180" x2="270" y2="180" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <line x1="130" y1="200" x2="270" y2="200" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <line x1="130" y1="220" x2="270" y2="220" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <line x1="130" y1="240" x2="270" y2="240" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
  <!-- Control panel -->
  <rect x="120" y="275" width="160" height="30" rx="4" fill="#334155"/>
  <circle cx="150" cy="290" r="8" fill="#22c55e"/>
  <rect x="170" y="282" width="80" height="16" rx="2" fill="#0f172a"/>
  <rect x="175" y="287" width="50" height="6" rx="1" fill="#3b82f6"/>
  <text x="200" y="380" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">3D视觉扫描仪</text>
</svg>