<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect fill="url(#bg4)" width="400" height="400"/>
  <!-- Feeder Machine Frame -->
  <rect x="60" y="100" width="280" height="250" rx="4" fill="#64748b"/>
  <rect x="70" y="110" width="260" height="180" rx="2" fill="#475569"/>
  <!-- Conveyor -->
  <rect x="80" y="250" width="240" height="30" rx="4" fill="#334155"/>
  <circle cx="100" cy="265" r="10" fill="#1e293b"/>
  <circle cx="200" cy="265" r="10" fill="#1e293b"/>
  <circle cx="300" cy="265" r="10" fill="#1e293b"/>
  <!-- Hopper -->
  <polygon points="120,120 280,120 260,180 140,180" fill="#1e293b"/>
  <rect x="150" y="180" width="100" height="60" fill="#0f172a"/>
  <!-- Parts falling -->
  <rect x="180" y="200" width="15" height="10" rx="2" fill="#f59e0b" transform="rotate(15 187 205)"/>
  <rect x="200" y="220" width="15" height="10" rx="2" fill="#f59e0b" transform="rotate(-10 207 225)"/>
  <rect x="190" y="240" width="15" height="10" rx="2" fill="#f59e0b"/>
  <!-- Control Box -->
  <rect x="290" y="300" width="50" height="40" rx="4" fill="#1e293b"/>
  <circle cx="305" cy="315" r="5" fill="#22c55e"/>
  <circle cx="325" cy="315" r="5" fill="#3b82f6"/>
  <text x="200" y="380" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">牧河自动上料机</text>
</svg>