<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect fill="url(#bg9)" width="400" height="400"/>
  <!-- Sorting Robot Frame -->
  <rect x="150" y="300" width="100" height="60" rx="8" fill="#475569"/>
  <!-- Robot Arm Base -->
  <rect x="180" y="260" width="40" height="50" rx="4" fill="#334155"/>
  <!-- Robot Arm segments -->
  <rect x="175" y="180" width="50" height="90" rx="4" fill="#1e293b" transform="rotate(-20 200 225)"/>
  <circle cx="200" cy="180" r="15" fill="#475569"/>
  <rect x="160" y="100" width="40" height="90" rx="4" fill="#1e293b" transform="rotate(15 180 145)"/>
  <circle cx="180" cy="100" r="12" fill="#475569"/>
  <!-- Gripper -->
  <rect x="200" y="60" width="8" height="40" rx="2" fill="#64748b"/>
  <rect x="180" y="55" width="15" height="20" rx="2" fill="#334155"/>
  <rect x="215" y="55" width="15" height="20" rx="2" fill="#334155"/>
  <!-- Products being sorted -->
  <rect x="80" y="320" width="40" height="30" rx="4" fill="#22c55e"/>
  <rect x="280" y="320" width="40" height="30" rx="4" fill="#ef4444"/>
  <!-- Conveyor belts -->
  <rect x="60" y="355" width="80" height="15" rx="2" fill="#0f172a"/>
  <rect x="260" y="355" width="80" height="15" rx="2" fill="#0f172a"/>
  <!-- Labels -->
  <text x="100" y="385" text-anchor="middle" font-family="Arial" font-size="10" fill="#22c55e">合格品</text>
  <text x="300" y="385" text-anchor="middle" font-family="Arial" font-size="10" fill="#ef4444">不合格</text>
  <text x="200" y="395" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">智能分拣机器人</text>
</svg>