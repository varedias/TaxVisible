<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect fill="url(#bg6)" width="400" height="400"/>
  <!-- Telecentric Lens Body -->
  <rect x="100" y="100" width="200" height="80" rx="8" fill="#1e293b"/>
  <!-- Lens barrel -->
  <rect x="80" y="180" width="60" height="120" rx="4" fill="#334155"/>
  <ellipse cx="110" cy="180" rx="30" ry="10" fill="#475569"/>
  <ellipse cx="110" cy="300" rx="25" ry="8" fill="#0f172a"/>
  <!-- Front lens element -->
  <ellipse cx="110" cy="310" rx="20" ry="6" fill="#1e3a5f"/>
  <ellipse cx="110" cy="310" rx="12" ry="4" fill="#3b82f6"/>
  <!-- Adjustment rings -->
  <rect x="85" y="200" width="50" height="15" rx="2" fill="#64748b"/>
  <rect x="85" y="230" width="50" height="15" rx="2" fill="#64748b"/>
  <rect x="85" y="260" width="50" height="15" rx="2" fill="#64748b"/>
  <!-- Mount interface -->
  <rect x="260" y="110" width="40" height="60" rx="4" fill="#475569"/>
  <circle cx="280" cy="140" r="20" fill="#334155"/>
  <circle cx="280" cy="140" r="12" fill="#1e293b"/>
  <!-- Label -->
  <rect x="150" y="120" width="100" height="40" rx="4" fill="#0f172a"/>
  <text x="200" y="145" text-anchor="middle" font-family="Arial" font-size="12" fill="#94a3b8">50mm</text>
  <text x="200" y="380" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">远心镜头 50mm</text>
</svg>