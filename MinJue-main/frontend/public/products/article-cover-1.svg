  <rect fill="#7dd3fc" x="70" y="150" width="50" height="4" rx="1"/>
  <rect fill="#7dd3fc" x="70" y="160" width="55" height="4" rx="1"/>
  <rect fill="#7dd3fc" x="70" y="170" width="45" height="4" rx="1"/>
  <rect fill="#7dd3fc" x="70" y="185" width="60" height="4" rx="1"/>
  <rect fill="#7dd3fc" x="70" y="195" width="50" height="4" rx="1"/>
  <!-- 标签 -->
  <rect fill="#22d3ee" x="460" y="80" width="80" height="24" rx="12"/>
