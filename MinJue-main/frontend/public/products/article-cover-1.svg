  </defs>
  <rect fill="url(#bg4)" width="600" height="340"/>
  <!-- 文章文档示意 -->
  <rect fill="white" x="180" y="40" width="240" height="260" rx="8"/>
  <rect fill="#f0f9ff" x="195" y="55" width="210" height="230" rx="4"/>
  <!-- 文章内容 -->
  <rect fill="#0284c7" x="210" y="70" width="120" height="16" rx="2"/>
  <rect fill="#7dd3fc" x="210" y="95" width="180" height="8" rx="2"/>
