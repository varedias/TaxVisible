  <rect fill="#7dd3fc" x="210" y="125" width="170" height="8" rx="2"/>
  <!-- 图片占位 -->
  <rect fill="#bae6fd" x="210" y="145" width="180" height="60" rx="4"/>
  <circle fill="#38bdf8" cx="260" cy="175" r="15"/>
  <polygon fill="#0ea5e9" points="290,190 320,165 350,190"/>
  <!-- 更多文字 -->
  <rect fill="#7dd3fc" x="210" y="215" width="180" height="8" rx="2"/>
  <rect fill="#7dd3fc" x="210" y="230" width="140" height="8" rx="2"/>
  <rect fill="#7dd3fc" x="210" y="245" width="160" height="8" rx="2"/>
