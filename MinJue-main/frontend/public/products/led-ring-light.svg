<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect fill="url(#bg1)" width="400" height="400"/>
  <!-- LED Ring Light -->
  <circle cx="200" cy="180" r="100" fill="none" stroke="#3b82f6" stroke-width="20"/>
  <circle cx="200" cy="180" r="70" fill="none" stroke="#60a5fa" stroke-width="8"/>
  <circle cx="200" cy="180" r="40" fill="#1e40af"/>
  <!-- Light rays -->
  <g stroke="#fbbf24" stroke-width="3">
    <line x1="200" y1="60" x2="200" y2="40"/>
    <line x1="280" y1="100" x2="294" y2="86"/>
    <line x1="300" y1="180" x2="320" y2="180"/>
    <line x1="280" y1="260" x2="294" y2="274"/>
    <line x1="120" y1="100" x2="106" y2="86"/>
    <line x1="100" y1="180" x2="80" y2="180"/>
    <line x1="120" y1="260" x2="106" y2="274"/>
  </g>
  <!-- Base -->
  <rect x="160" y="300" width="80" height="60" rx="4" fill="#475569"/>
  <rect x="170" y="310" width="60" height="10" rx="2" fill="#94a3b8"/>
  <text x="200" y="360" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">CCS LED环形光源</text>
</svg>