<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#3730a3"/>
    </linearGradient>
  </defs>
  <rect fill="url(#bg2)" width="600" height="340"/>
  <!-- AI视觉系统示意 -->
  <rect fill="#4338ca" x="100" y="60" width="180" height="120" rx="6"/>
  <rect fill="#312e81" x="115" y="75" width="150" height="90" rx="3"/>
  <!-- 检测框 -->
  <rect fill="none" stroke="#22d3ee" stroke-width="2" x="130" y="90" width="50" height="50"/>
  <rect fill="none" stroke="#10b981" stroke-width="2" x="190" y="100" width="40" height="40"/>
  <!-- 连接线 -->
  <line stroke="#22d3ee" stroke-width="2" x1="280" y1="120" x2="340" y2="120"/>
  <line stroke="#22d3ee" stroke-width="2" x1="340" y1="120" x2="340" y2="80"/>
  <line stroke="#22d3ee" stroke-width="2" x1="340" y1="120" x2="340" y2="160"/>
  <!-- AI处理单元 -->
  <rect fill="#4f46e5" x="340" y="60" width="160" height="120" rx="8"/>
  <text fill="#a5b4fc" font-family="Arial" font-size="12" x="420" y="90" text-anchor="middle">AI Processing</text>
  <rect fill="#6366f1" x="360" y="100" width="120" height="8" rx="2"/>
  <rect fill="#818cf8" x="360" y="115" width="90" height="8" rx="2"/>
  <rect fill="#a5b4fc" x="360" y="130" width="105" height="8" rx="2"/>
  <rect fill="#c7d2fe" x="360" y="145" width="75" height="8" rx="2"/>
  <!-- 输出结果 -->
  <rect fill="#059669" x="420" y="200" width="100" height="40" rx="4"/>
  <text fill="white" font-family="Arial" font-size="11" x="470" y="225" text-anchor="middle">✓ PASS 99.8%</text>
  <!-- 播放按钮 -->
  <circle fill="rgba(255,255,255,0.95)" cx="300" cy="280" r="28"/>
  <polygon fill="#4f46e5" points="292,265 292,295 318,280"/>
  <!-- 标题 -->
  <text fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold" x="300" y="330" text-anchor="middle">AI视觉检测系统实战</text>
</svg>
