<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect fill="url(#bg3)" width="400" height="400"/>
  <!-- AI Vision System Cabinet -->
  <rect x="80" y="80" width="240" height="280" rx="8" fill="#1e293b"/>
  <rect x="90" y="90" width="220" height="200" rx="4" fill="#0f172a"/>
  <!-- Screen -->
  <rect x="100" y="100" width="200" height="140" rx="2" fill="#1e3a5f"/>
  <!-- AI Vision Graphics -->
  <rect x="120" y="120" width="70" height="50" stroke="#3b82f6" stroke-width="2" fill="none"/>
  <circle cx="155" cy="145" r="15" stroke="#22c55e" stroke-width="2" fill="none"/>
  <text x="155" y="150" text-anchor="middle" font-family="Arial" font-size="10" fill="#22c55e">OK</text>
  <rect x="210" y="120" width="70" height="50" stroke="#3b82f6" stroke-width="2" fill="none"/>
  <line x1="210" y1="120" x2="280" y2="170" stroke="#ef4444" stroke-width="2"/>
  <line x1="280" y1="120" x2="210" y2="170" stroke="#ef4444" stroke-width="2"/>
  <!-- Status Bar -->
  <rect x="120" y="190" width="160" height="30" rx="2" fill="#0f172a"/>
  <rect x="125" y="195" width="40" height="20" rx="2" fill="#22c55e"/>
