  <rect x="100" y="300" width="200" height="50" rx="4" fill="#334155"/>
  <circle cx="140" cy="325" r="15" fill="#475569"/>
  <circle cx="200" cy="325" r="15" fill="#22c55e"/>
  <circle cx="260" cy="325" r="15" fill="#ef4444"/>
  <text x="200" y="380" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">海康威视AI视觉检测系统</text>
